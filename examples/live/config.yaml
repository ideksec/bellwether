apiVersion: bellwether/v1
kind: Config

# A minimal, cheap config for a *live* smoke run — the one that proves `bellwether run`
# works against a real model end to end. It uses the api-loop harness (the model runs on the
# host; only the tools exec into the sandbox, so it is the cheapest form of a real run) and
# the smallest model, with a hard per-run token cap passed on the command line.
#
# The key is read from ANTHROPIC_API_KEY by the host and never enters the sandbox — the
# recording proxy injects it (§3.3). For a real skill repository, keep your own config under
# .bellwether/; this one lives under examples/ because it is the project's own smoke setup.

providers:
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    models:
      # The cheapest model, to prove the pipeline. Bump deliberately once it is green.
      haiku: "claude-haiku-4-5-20251001"

harnesses:
  api-loop:
    type: api-loop
    tools: [read, write, bash, fetch]

sandbox:
  backend: docker
  # A small, digest-pinned image with the busybox tools the api-loop uses (cat, sh, mkdir,
  # dirname). The same image the container tests pull, so it is reachable under restrictive
  # egress and already vetted.
  image: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc
  memory: 2g
  cpus: 2
  pids_limit: 512
  timeout_seconds: 300
  writable_paths: ["/work", "/tmp", "/home/agent/.claude"]
  randomize_identifiers: true

egress:
  # Turn the recording proxy on. The workflow builds this image before the run; it is a moving
  # tag rather than a digest (a non-blocking advisory prints), which is acceptable for the
  # project's own smoke image built fresh each run. With it set, each repetition is stood up
  # behind a dual-homed sidecar: the sandbox routes through it and egress is *observed* (§10.5),
  # so a clean benign run reaches `ready` instead of being held `conditional` on an unobserved
  # plane. The api-loop model runs host-side, so the sandbox is handed no credential.
  image: bw-proxy-sidecar:live

dns:
  # Turn the controlled resolver on — the second sidecar, built by the workflow exactly like
  # the proxy's (same moving-tag reasoning). With it set, the sandbox is pointed at the
  # resolver via --dns, every lookup is logged as Plane E, and the DNS gate is decided from
  # observed evidence (§10.6) instead of deferring — which is what keeps the benign run at
  # `ready` now that the DNS disposition is a scored gate. An HTTP proxy never sees UDP/53;
  # this is the plane that watches the covert channel routing around it.
  image: bw-resolver-sidecar:live

capture:
  filesystem_writes: overlay
  filesystem_reads: fanotify
  process: ebpf
  harness_hooks: true
  harness_event_sink: fifo
  zones:
    workspace: /work
    harness_state: /home/agent/.claude
