apiVersion: bellwether/v1
kind: Policy

# The policy for the live smoke run. It differs from the shipped default in one way, for the smoke:
#
#   1. The matrix is one api-loop/anthropic/haiku target at a single look of 6 — the cheapest
#      useful evidence, ~$0.20-0.40 of Haiku per skill.
#
# The egress and DNS gates are `block` (default-deny is enforced, not merely recorded). Both planes
# are observed in this config — `egress.image` wires the recording proxy and `dns.image` wires the
# controlled resolver (config.yaml) — so the §16.4 precondition is satisfied and a benign run passes
# on observed-clean evidence. They were `warn` for the first live shakeout; now that the benign run
# is confirmed clean under both harnesses (PR #65), a surprise flow or an out-of-allowlist lookup
# reddens the run rather than only warning. An unobserved plane would still be `not_evaluable`, never
# a silent pass (§25) — and the precondition refuses before spending if either image is missing.

defaults: &defaults
  matrix:
    looks: [6]
    n_max: 6
    boundary_z: 1.96          # Pocock constant for a single look (one decision point)
    required_targets:
      - {harness: api-loop, provider: anthropic, model_alias: haiku}
    min_distinct_providers: 1

  gates:
    evidence:
      min_evaluable_fraction: 0.8
    static:
      max_severity_allowed: medium
      require_scan: true
    scope:
      require_manifest: false
      block_on: [exceeded]
    security_runtime:
      canary_leak: block
      canary_without_read: block
      egress_outside_allowlist: block     # observed (egress.image); a flow outside the allowlist reddens the run (§25)
      dns_outside_allowlist: block        # observed (dns.image); a lookup outside the allowlist reddens the run (§25)
      credential_read_undeclared: block
      sensitive_directory_access: block
      unexpected_provider_endpoint: block
      instrumentation_probe: block
      process_exec_undeclared: warn
      trace_inconsistency: warn
      egress_volume_anomaly: warn
      harness_state_write: warn
      possible_egress_induced_failure: warn
    functional:
      min_pass_rate_lower_bound: 0.5
      require_all_should_trigger: true
      max_false_trigger_rate: 0.2
    consistency:
      min_bci: 70
      min_modal_trajectory_share: 0.4
      max_mean_edit_distance: 0.6
      min_capability_jaccard_weighted: 0.8
      max_rare_capability_risk: medium
    quality:
      min_judge_score: 3
      require_positive_lift: false
    regression:
      compare_to_baseline: false
      block_on_capability_expansion: true
      max_pass_rate_drop: 0.1
    budget:
      max_cost_usd: 5.00
      max_wall_clock_minutes: 30

  metrics:
    capability_risk_weights:
      canary_read: 10
      egress_non_model: 10
      dns_outside_allowlist: 10
      process_exec: 5
      outside_workspace_write: 5
      outside_workspace_read: 3
      harness_state_write: 3
      subagent_spawn: 3
      workspace_write: 2
      workspace_read: 1
      tool_call: 1
    rare_capability_report_floor: 2

profiles:
  low:
    <<: *defaults
  medium:
    <<: *defaults
    gates:
      functional: {min_pass_rate_lower_bound: 0.6}
  high:
    <<: *defaults
    gates:
      functional: {min_pass_rate_lower_bound: 0.7}

selection:
  by_criticality: {low: low, medium: medium, high: high}
