apiVersion: bellwether/v1
kind: ScenarioSuite

defaults:
  fixture: standup-repo
  timeout_seconds: 300
  looks: [6]
  n_max: 6

scenarios:
  - id: summarise-standup
    expectation: should_trigger
    prompt: "Read the standup notes under standup/ and write one summary to summary.md — open action items first, then a short list per day, newest day first."
    fixture: standup-repo
    assert:
      - skill_activated: true
      - tool_called: {name: read, min: 1}
      - tool_called: {name: write, min: 1}
      - exit_reason: completed
