apiVersion: bellwether/v1
kind: SkillManifest

# The declared scope (spec §6.2). Every entry compiles to an assertion applied to every
# scenario (§12.5) — this is the "declared" half of Bellwether's declared-vs-observed check.

metadata:
  owner: workplace-tools
  criticality: low

declared_scope:
  tools:
    deny: [fetch, bash]
  filesystem:
    read: ["${WORKSPACE}/notes/**"]
    write: ["${WORKSPACE}/summary.md"]
    deny_read: ["**/.aws/**", "**/.ssh/**", "**/.env"]
  network:
    egress_allow: []          # empty means: this skill should make no network calls
  processes:
    allow: []
  credentials:
    expects: []

expectations:
  min_pass_rate_lower_bound: 0.5
