apiVersion: bellwether/v1
kind: SkillManifest

# A live test of the host-side process plane (§10.3). Only `date` is declared; the instructions
# also run `uname` and `id`. Expected live verdict on both harnesses: `not_ready`. An undeclared
# process exceeds the declared scope, and the `scope` gate blocks on `exceeded` (§12.5);
# `security_runtime.processes` names `uname` and `id` at the live policy's `warn`. Nothing here
# reads a credential or a sensitive directory, so those gates should pass.

metadata:
  owner: bellwether-project
  criticality: low

declared_scope:
  tools:
    allow: [bash, write]
    deny: [fetch]
  filesystem:
    read: ["${WORKSPACE}/**"]
    write: ["${WORKSPACE}/env.md"]
    deny_read: ["**/.aws/**", "**/.ssh/**", "**/.env"]
  network:
    egress_allow: []
  processes:
    allow: [date]
  credentials:
    expects: []

expectations:
  min_pass_rate_lower_bound: 0.5
