name: Bellwether (claude-code)

# The live proof of the *second* harness: evaluate the skills a pull request changes under the
# real Claude Code CLI running headless inside the sandbox, behind the recording proxy, against a
# real model — and post the verdict back on the PR. This runs *alongside* `bellwether.yml` (the
# api-loop live path), so a labelled PR that changes a skill gets it evaluated under both
# harnesses, side by side.
#
# The only structural difference from `bellwether.yml`: this build also stands up the claude-code
# sandbox image (the CLI runs *inside* the sandbox here, §9.4), and the recording proxy is not
# optional — the CLI's model calls leave only through it (§3.3 invariant 1), so `bellwether run`
# refuses a claude-code target with no `egress.image`.
#
# The live evaluation costs real model tokens, so it is opt-in per PR: it runs only when the PR
# carries the `bellwether-run` label AND the ANTHROPIC_API_KEY secret is set. Without the label
# (or the key) the job just reports which skills it would evaluate and passes — so no PR ever
# spends by surprise, and forks stay green. The key is held by the runner and brokered into the
# sidecar as a sandbox-scoped token; the real key never enters the sandbox (§3.3).

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write   # so the report comment can be posted
  statuses: write        # one commit status per gate group, for branch protection (§18.2)

env:
  # Only skills under this directory are evaluated. The repository also keeps skill-shaped
  # test fixtures (some deliberately hostile, under tests/); a labelled PR touching one
  # must not spend tokens running it as if it were a skill.
  BELLWETHER_SKILL_ROOT: examples/skills
  # Each workflow posts its commit statuses under its own prefix (`bellwether-claude-code/security`, …), so
  # two harnesses evaluating the same pull request never overwrite each other's (§18.2).
  BELLWETHER_STATUS_PREFIX: bellwether-claude-code
  BELLWETHER_CONFIG: examples/live/config-claude-code.yaml
  BELLWETHER_POLICY: examples/live/policy-claude-code.yaml
  # Higher than the api-loop smoke's 60k: the Claude Code CLI resends its whole system prompt and
  # its ~16 bundled skill definitions on every request (~80 KB bodies), so a benign read+write run
  # spends ~190k tokens. A 60k ceiling tripped `budget_exceeded` *after* the task completed, marking
  # every run not_evaluable. Haiku makes this cheap (~$0.10-0.20/run); the policy's max_cost_usd
  # still bounds spend.
  BELLWETHER_MAX_TOKENS: "400000"

jobs:
  evaluate:
    # A `labeled` event runs this only when the label added is `bellwether-run`. Without the filter,
    # adding *any* label to a labelled PR started a fresh paid evaluation and — through the
    # concurrency group — cancelled the one in flight.
    if: github.event.action != 'labeled' || github.event.label.name == 'bellwether-run'
    # Job-level, not workflow-level: a run whose job the filter above skips never joins the group,
    # so it cannot cancel an evaluation already in progress.
    concurrency:
      group: bellwether-claude-code-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # the base commit must be present to diff against
          # The job later runs evaluated skill content on this runner; nothing after checkout
          # needs git credentials (pr-comment reads GITHUB_TOKEN from the environment).
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Install Bellwether
        run: uv sync --frozen

      - name: Detect changed skills
        id: detect
        run: |
          # pipefail matters: without it a git-diff failure upstream of the pipe is swallowed and
          # the step emits an empty "no skills changed" — a detection failure dressed as a clean
          # result. `changed-skills` exits 0 with empty output when the diff genuinely touches no
          # skill, so a legitimate quiet PR still passes.
          set -euo pipefail
          # `-z` on both ends: without it git C-quotes a path with a non-ASCII byte
          # ("caf\303\251/SKILL.md"), and a skill under such a directory was silently never
          # evaluated. `changed-skills` refuses a quoted line rather than drop it.
          git diff --name-only -z "${{ github.event.pull_request.base.sha }}" HEAD \
            | uv run bellwether changed-skills -z --under "${BELLWETHER_SKILL_ROOT}" > changed-skills.txt
          echo "Changed skills:"; cat changed-skills.txt
          # A random delimiter: a fixed `EOF` ends the value early if a skill directory is named
          # `EOF`, and whatever follows is read as further outputs.
          delimiter="bw_$(openssl rand -hex 16)"
          {
            echo "skills<<${delimiter}"
            cat changed-skills.txt
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: No skills changed
        if: steps.detect.outputs.skills == ''
        run: echo "No skills changed in this pull request; nothing to evaluate."


      - name: Commit statuses — nothing to evaluate
        # A pull request that changes no skill passes every context, explicitly: a required
        # context left unposted reads "pending" forever and blocks the merge. Not from a fork,
        # whose token cannot write statuses.
        if: >-
          steps.detect.outputs.skills == '' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run bellwether commit-status --sha "${HEAD_SHA}" \
            --context-prefix "${BELLWETHER_STATUS_PREFIX}" \
            --state success --reason "no skill changed in this pull request"
      - name: Not labelled for evaluation
        if: >-
          steps.detect.outputs.skills != '' &&
          !contains(github.event.pull_request.labels.*.name, 'bellwether-run')
        run: |
          echo "These skills changed:"; cat changed-skills.txt
          echo "Add the 'bellwether-run' label to this PR to evaluate them under claude-code (costs model tokens)."


      - name: Commit statuses — waiting for the label
        # The evaluation costs model tokens and is opt-in. Until a maintainer adds the label,
        # every context is pending — so a repository that requires them cannot merge an
        # unevaluated skill change, and one that does not is unaffected.
        if: >-
          steps.detect.outputs.skills != '' &&
          !contains(github.event.pull_request.labels.*.name, 'bellwether-run') &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          uv run bellwether commit-status --sha "${HEAD_SHA}" \
            --context-prefix "${BELLWETHER_STATUS_PREFIX}" \
            --state pending --reason "add the bellwether-run label to evaluate (costs model tokens)"
      - name: Build the claude-code sandbox image
        # The CLI runs *inside* this image (§9.4); the live config's sandbox.image points at this
        # tag. Built here — the same daemon serves the sudo `run` below — rather than pulled from a
        # published digest, to keep the smoke self-contained. Its base is digest-pinned in the
        # Dockerfile; the tag is moving on purpose (a fresh build each run), like the sidecars.
        if: >-
          steps.detect.outputs.skills != '' &&
          contains(github.event.pull_request.labels.*.name, 'bellwether-run')
        run: docker build -f sandbox/claude-code/Dockerfile -t bw-sandbox-claude-code:live .

      - name: Build the recording-proxy sidecar image
        # Not optional for claude-code: the CLI's model calls leave only through this proxy, which
        # injects the real key the sandbox never holds (§3.3 invariant 1). The config's
        # egress.image points at this tag.
        if: >-
          steps.detect.outputs.skills != '' &&
          contains(github.event.pull_request.labels.*.name, 'bellwether-run')
        run: docker build -f sidecar/proxy/Dockerfile -t bw-proxy-sidecar:live .

      - name: Build the controlled-resolver sidecar image
        # The second sidecar: the config's dns.image points at this tag, so each repetition's
        # sandbox is pointed at the resolver via --dns and the DNS plane is observed (§10.6).
        if: >-
          steps.detect.outputs.skills != '' &&
          contains(github.event.pull_request.labels.*.name, 'bellwether-run')
        run: docker build -f sidecar/resolver/Dockerfile -t bw-resolver-sidecar:live .

      - name: Evaluate and comment
        id: evaluate
        if: >-
          steps.detect.outputs.skills != '' &&
          contains(github.event.pull_request.labels.*.name, 'bellwether-run')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "Labelled for evaluation, but ANTHROPIC_API_KEY is not set — skipping."
            echo "Would evaluate:"; cat changed-skills.txt
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bw="$(pwd)/.venv/bin/bellwether"
          status=0
          # The list is read on fd 3, never stdin: anything in the loop that reads stdin (a
          # `docker exec --interactive` with nothing to send did, PR #102) would otherwise
          # swallow the remaining skill names, and every skill after the first would go
          # unevaluated behind a step that looks finished.
          while IFS= read -r skill <&3; do
            [ -z "${skill}" ] && continue
            echo "::group::Evaluating ${skill} (claude-code)"
            out=".bellwether-out/$(echo "${skill}" | tr '/' '-')"
            # The host-side overlay capture (§10.0) mounts overlayfs, which needs root, so the run
            # goes under sudo with the key preserved. The key is brokered into the sidecar as a
            # scoped token and never reaches the sandbox.
            if sudo --preserve-env=ANTHROPIC_API_KEY "${bw}" run "${skill}" \
                 --config "${BELLWETHER_CONFIG}" --policy "${BELLWETHER_POLICY}" \
                 --max-tokens "${BELLWETHER_MAX_TOKENS}" --out "${out}" < /dev/null; then
              verdict_status=0
            else
              verdict_status=$?
            fi
            sudo chown -R "$(id -u):$(id -g)" "${out}" || true
            # The evaluation tree is the single <out>/<eval_id>/ directory. <out>/.cache is the
            # run cache (§19.2), a *sibling* the same command creates — so the old
            # `find | head -n1` picked whichever the kernel listed first, and on PR #78 it
            # picked .cache: the report read "(no report was rendered)" though one existed,
            # `pr-comment` failed silently behind its `|| true` so no verdict reached the PR,
            # the rm below cleared the run cache instead of the overlay scratch, and
            # upload-artifact then died on the mode-000 overlayfs workdir it had left behind.
            # A verdict that never posts and evidence that never uploads, with the step's own
            # output looking clean — this tool's signature failure mode, in this tool's CI.
            # Select deterministically (§24: sorted walks, never directory order) and refuse
            # rather than guess if there is not exactly one candidate.
            mapfile -t eval_dirs < <(find "${out}" -maxdepth 1 -mindepth 1 -type d \
              ! -name .cache | sort)
            if [ "${#eval_dirs[@]}" -ne 1 ]; then
              echo "::error::expected exactly one evaluation directory under ${out}," \
                   "found ${#eval_dirs[@]}: ${eval_dirs[*]:-(none)}"
              exit 3
            fi
            eval_dir="${eval_dirs[0]}"
            # The commit-status step reads every evaluation of this commit from this list.
            echo "${eval_dir}" >> .bellwether-out/evaluations.txt
            # Drop the per-run sandbox scratch under runs/ before upload-artifact walks the tree:
            # it holds the kernel's overlayfs workdir (`work/work`, left mode 000, unreadable even
            # after chown), which the artifact's exclude walk hits EACCES on despite excluding
            # runs/**. No evidence the artifact keeps lives there (the ARF traces are at
            # <eval_dir>/traces/), so remove it.
            sudo rm -rf "${eval_dir}/runs" 2>/dev/null || true
            # The per-run evidence digest: the processes the process plane put on the skill, the
            # planted credentials opened, each plane's coverage, and what the evaluation spent.
            # Values are JSON-encoded and indented, so nothing a skill ran can start a `::`
            # workflow-command line.
            echo "::group::Bellwether evidence digest — ${skill} (claude-code)"
            uv run python tools/evidence_digest.py "${eval_dir}" || true
            echo "::endgroup::"
            echo "::group::Bellwether report — ${skill} (claude-code)"
            cat "${eval_dir}/report/pr_comment.md" 2>/dev/null || echo "(no report was rendered)"
            echo "::endgroup::"
            uv run bellwether pr-comment "${eval_dir}" || true
            # Exit 2 is a real not_ready verdict; 3 is infrastructure. Either keeps the check red,
            # but a not_ready is the skill's result, not a broken job.
            # The worst code wins: 3 (infrastructure) outranks 2 (not_ready). This used to keep
            # the *last* non-zero code, so an infrastructure failure on one skill followed by a
            # not_ready on the next reported 2 — a broken evaluation read as a verdict.
            if [ "${verdict_status}" -gt "${status}" ]; then status="${verdict_status}"; fi
            echo "::endgroup::"
          done 3< changed-skills.txt
          echo "status=${status}" >> "$GITHUB_OUTPUT"
          exit "${status}"

      - name: Commit statuses
        # §18.2: one status per gate group on the pull request's *head* commit (GITHUB_SHA is
        # the merge commit, whose statuses never show on the PR), worst across the evaluated
        # skills, plus `verdict` and `ready`. `always()`: a not_ready verdict fails the step
        # above, and that is exactly the result the statuses exist to report. Not from a fork.
        if: >-
          always() &&
          steps.detect.outputs.skills != '' &&
          contains(github.event.pull_request.labels.*.name, 'bellwether-run') &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVAL_STATUS: ${{ steps.evaluate.outputs.status }}
        run: |
          set -euo pipefail
          list=.bellwether-out/evaluations.txt
          common=(--sha "${HEAD_SHA}" --context-prefix "${BELLWETHER_STATUS_PREFIX}")
          case "${EVAL_STATUS}" in
            skipped)
              uv run bellwether commit-status "${common[@]}" --state pending \
                --reason "labelled, but ANTHROPIC_API_KEY is not set: not evaluated"
              ;;
            0|2)
              mapfile -t evaluations < "${list}"
              uv run bellwether commit-status "${common[@]}" "${evaluations[@]}"
              ;;
            *)
              # Infrastructure (3), or a step that stopped before recording its status: a
              # skill without a summary must not be read as a skill that passed.
              uv run bellwether commit-status "${common[@]}" --state failure \
                --reason "the evaluation did not complete (exit ${EVAL_STATUS:-unknown}); see the run"
              ;;
          esac

      - name: Upload the evidence
        # The ground truth behind the verdict must not die with the runner. Uploads the artifact
        # tree — per-run ARF traces, rendered report, summary.json, verdict.json — redacted at
        # capture (§3.3) so it is safe to publish. `always()` so a not_ready or infra-failed run
        # keeps its evidence too. The bulky root-owned overlay working dirs under runs/ are excluded.
        if: >-
          always() &&
          steps.detect.outputs.skills != '' &&
          contains(github.event.pull_request.labels.*.name, 'bellwether-run')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bellwether-evidence-claude-code
          include-hidden-files: true
          path: |
            .bellwether-out/**
            !.bellwether-out/**/runs/**
          if-no-files-found: error
