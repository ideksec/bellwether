name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Set, and deliberately not relied upon: §24 requires that ordering never depends on
  # `hash()`. Pinning the seed makes an accidental dependency reproducible rather than
  # intermittent; the tests still must not need it.
  PYTHONHASHSEED: "0"
  # Determinism of Bellwether's own output is a release requirement (§24), and locale is
  # one of the ways it quietly stops holding.
  LC_ALL: C.UTF-8
  LANG: C.UTF-8
  # Any small image works. This one serves blobs from the registry host rather than a
  # CDN, so it also pulls under restrictive egress policies — including the environment
  # these tests were first written in. Pinned by digest, not just tag: a supply-chain
  # tool that pulls a mutable tag in its own CI would be undermining its own thesis.
  # To update: docker buildx imagetools inspect alpine:3.20 (or query the registry) and
  # replace the digest below with the manifest-list digest for the new tag.
  BELLWETHER_TEST_IMAGE: alpine:3.20@sha256:d9e853e87e55526f6b2917df91a2115c36dd7c696a35be12163d44e6e2a4b6bc

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          # Pin the uv version too, so a compromised uv release cannot enter via the
          # action resolving "latest". Bump deliberately alongside the lockfile.
          version: "0.8.17"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy

      # §8.1's acyclic module graph, enforced mechanically rather than by convention.
      - name: Module boundaries
        run: uv run lint-imports

      # §16.3. The verdict vocabulary must not imply proof, and the rule fails the build.
      - name: Language discipline
        run: uv run python tools/language_lint.py

      # Supply-chain hygiene: every third-party action pinned to a commit SHA, every image
      # pinned by digest. A tool about supply chain must not pull mutable tags in its own CI.
      - name: Pinning discipline
        run: uv run python tools/pin_lint.py

      # The real Claude Code CLI, pinned to the version the adapter's golden session was
      # taken from (sandbox/claude-code/Dockerfile pins the same). With it on PATH the
      # offline suite drives the real binary headless against a scripted Messages API on
      # localhost — no key, no container — so a CLI format change breaks a test here.
      # Installed from the same integrity-locked package-lock.json the sandbox image uses.
      - name: Install the Claude Code CLI
        run: |
          npm ci --prefix sandbox/claude-code/cli --omit=dev --no-audit --no-fund
          echo "$PWD/sandbox/claude-code/cli/node_modules/.bin" >> "$GITHUB_PATH"

      # The offline suite: no API key, no daemon. The container tests are a separate
      # job so that their absence here is a deselection rather than a silent skip.
      #
      # `-rs` prints the reason for every skip. A count of skips says nothing about which.
      - name: Tests
        run: uv run pytest -m "not docker" -rs

  # §24 requires the capture-plane integration tests to run on the project's own CI
  # runner, "so that degraded coverage is visible to maintainers". A suite that passes
  # green with these quietly skipped is the clean-looking failure this tool exists to
  # distrust — so this job asserts they were collected, and fails if they were not.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          # Pin the uv version too, so a compromised uv release cannot enter via the
          # action resolving "latest". Bump deliberately alongside the lockfile.
          version: "0.8.17"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --group dev --frozen

      - name: Check the daemon and overlayfs
        run: |
          docker info --format 'docker {{.ServerVersion}} storage={{.Driver}}'
          grep -q overlay /proc/filesystems && echo "overlayfs present"

      - name: Pull the test image
        run: docker pull -q "$BELLWETHER_TEST_IMAGE"

      # Checked before the run, not after: a deselected-to-zero run reports success
      # having asserted nothing, and this job exists precisely so that the container
      # tests cannot pass by being absent.
      #
      # Ordered first for a second reason — collection runs as the normal user, and the
      # test step below runs as root. Root touching the virtualenv leaves it owned by
      # root, and any later step as the normal user then fails on permissions.
      - name: Assert the container tests are collected
        run: |
          set +e
          uv run pytest -m docker --collect-only -q
          status=$?
          set -e
          # pytest exits 5 for "no tests collected" — a documented code, rather than a
          # string match on output that changes between versions.
          if [ "$status" -eq 5 ]; then
            echo "::error::no container tests were collected; this job asserted nothing"
            exit 1
          elif [ "$status" -ne 0 ]; then
            echo "::error::collecting the container tests failed (exit $status)"
            exit 1
          fi

      # The four workflows that spend money hand the provider key to a root process with
      # `sudo --preserve-env=ANTHROPIC_API_KEY`. None of them runs on a pull request, so a
      # runner whose sudo stopped honouring that form would be found by a paid run and by
      # nothing else. This job is free and runs on the same image; it asks the question.
      - name: Assert sudo carries a named variable
        env:
          BW_SUDO_PROBE: carried
        run: |
          sudo --version | head -n 1
          got="$(sudo --preserve-env=BW_SUDO_PROBE sh -c 'printf %s "${BW_SUDO_PROBE:-}"')"
          if [ "$got" != "carried" ]; then
            echo "::error::sudo --preserve-env=NAME did not carry the variable (got '${got}'); the evaluation workflows pass the provider key this way"
            exit 1
          fi
          echo "sudo --preserve-env=NAME carries a named variable"

      # sudo because mounting the host-side overlay upper directory needs root — the
      # privilege the *host* has and the container does not, which is the whole capture
      # architecture in one line (§10.0).
      #
      # The interpreter is invoked directly rather than through `uv run`: uv would want
      # to resolve and possibly rewrite the environment as root, and the environment
      # belongs to the normal user.
      #
      # The variables are handed to the root process by name, through `env`. `sudo -E` used
      # to carry them, and stopped: the sudo on ubuntu-26.04 prints "preserving the entire
      # environment is not supported, '-E' is ignored" and carries on without them. `CI` was
      # one of them, the tests that build the sidecar images gate on it, and for twelve
      # merges they skipped while this job stayed green. `sudo env NAME=value` does not
      # depend on which sudo this is or how it treats the caller's environment.
      #
      # `--skips-are-failures` (tests/skip_guard.py) is the half that would have caught it:
      # on this job a skip is a failure, whatever the reason. It is an argument, not a
      # variable, because the thing it guards against is a variable not arriving.
      - name: Container integration tests
        run: |
          sudo env \
            "CI=${CI}" \
            "BELLWETHER_TEST_IMAGE=${BELLWETHER_TEST_IMAGE}" \
            "PYTHONHASHSEED=${PYTHONHASHSEED}" \
            "LC_ALL=${LC_ALL}" \
            "LANG=${LANG}" \
            "$(pwd)/.venv/bin/python" -m pytest -m docker -v --no-header -rs --skips-are-failures
