name: Bellwether

# Evaluate skills that a pull request changes, and post the verdict back on the PR.
#
# Every PR: `changed-skills` maps the diff to the skill directories affected (a skill is a
# directory with a SKILL.md), so skills nobody touched are never re-evaluated.
#
# The live evaluation costs real model tokens, so it is opt-in per PR: it runs only when the
# PR carries the `bellwether-run` label AND the ANTHROPIC_API_KEY secret is set. Without the
# label (or the key) the job just reports which skills it would evaluate and passes — so no PR
# ever spends by surprise, and forks stay green. The key is held by the runner and never enters
# the sandbox (§3.3); see docs/ci-integration.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  contents: read
  pull-requests: write   # so the report comment can be posted

env:
  # For a real skill repository, point these at your own .bellwether/ config. This repo uses
  # its own cheap smoke config (api-loop + Haiku, one look of 6, a hard token cap).
  BELLWETHER_CONFIG: examples/live/config.yaml
  BELLWETHER_POLICY: examples/live/policy.yaml
  BELLWETHER_MAX_TOKENS: "60000"

jobs:
  evaluate:
    # A `labeled` event runs this only when the label added is `bellwether-run`. Without the filter,
    # adding *any* label to a labelled PR started a fresh paid evaluation and — through the
    # concurrency group — cancelled the one in flight.
    if: github.event.action != 'labeled' || github.event.label.name == 'bellwether-run'
    # Job-level, not workflow-level: a run whose job the filter above skips never joins the group,
    # so it cannot cancel an evaluation already in progress.
    concurrency:
      group: bellwether-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0   # the base commit must be present to diff against
          # The job later runs evaluated skill content on this runner; nothing after checkout
          # needs git credentials (pr-comment reads GITHUB_TOKEN from the environment).
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.8.17"
          enable-cache: true

      - name: Install Bellwether
        run: uv sync --frozen

      - name: Detect changed skills
        id: detect
        run: |
          # pipefail matters: without it a git-diff failure upstream of the pipe is
          # swallowed and the step emits an empty "no skills changed" — a detection
          # failure dressed as a clean result, the exact false green this tool exists
          # to distrust. `changed-skills` itself exits 0 with empty output when the
          # diff genuinely touches no skill, so a legitimate quiet PR still passes.
          set -euo pipefail
          # `-z` on both ends: without it git C-quotes a path with a non-ASCII byte
          # ("caf\303\251/SKILL.md"), and a skill under such a directory was silently never
          # evaluated. `changed-skills` refuses a quoted line rather than drop it.
          git diff --name-only -z "${{ github.event.pull_request.base.sha }}" HEAD \
            | uv run bellwether changed-skills -z > changed-skills.txt
          echo "Changed skills:"; cat changed-skills.txt
          # A random delimiter: a fixed `EOF` ends the value early if a skill directory is named
          # `EOF`, and whatever follows is read as further outputs.
          delimiter="bw_$(openssl rand -hex 16)"
          {
            echo "skills<<${delimiter}"
            cat changed-skills.txt
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: No skills changed
        if: steps.detect.outputs.skills == ''
        run: echo "No skills changed in this pull request; nothing to evaluate."

      - name: Not labelled for evaluation
        if: >-
          steps.detect.outputs.skills != '' &&
          !contains(github.event.pull_request.labels.*.name, 'bellwether-run')
        run: |
          echo "These skills changed:"; cat changed-skills.txt
          echo "Add the 'bellwether-run' label to this PR to evaluate them (costs model tokens)."

      - name: Build the recording-proxy sidecar image
        # Only when a paid evaluation will actually run. The live config's egress.image points at
        # this tag; building it here (rather than pulling a published digest) keeps the smoke setup
        # self-contained. It is built as the runner user but the same daemon serves the sudo `run`
        # below, so the sudo'd container sees the image (§10.5).
        if: >-
          steps.detect.outputs.skills != '' &&
          contains(github.event.pull_request.labels.*.name, 'bellwether-run')
        run: docker build -f sidecar/proxy/Dockerfile -t bw-proxy-sidecar:live .

      - name: Build the controlled-resolver sidecar image
        # The second sidecar, same reasoning as the proxy's: the live config's dns.image points
        # at this tag, so each repetition's sandbox is pointed at the resolver via --dns and the
        # DNS plane is observed (§10.6) — required for the scored DNS gate to pass rather than
        # defer on the labelled live run.
        if: >-
          steps.detect.outputs.skills != '' &&
          contains(github.event.pull_request.labels.*.name, 'bellwether-run')
        run: docker build -f sidecar/resolver/Dockerfile -t bw-resolver-sidecar:live .

      - name: Evaluate and comment
        if: >-
          steps.detect.outputs.skills != '' &&
          contains(github.event.pull_request.labels.*.name, 'bellwether-run')
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "Labelled for evaluation, but ANTHROPIC_API_KEY is not set — skipping."
            echo "Would evaluate:"; cat changed-skills.txt
            exit 0
          fi
          bw="$(pwd)/.venv/bin/bellwether"
          status=0
          while IFS= read -r skill; do
            [ -z "${skill}" ] && continue
            echo "::group::Evaluating ${skill}"
            out=".bellwether-out/$(echo "${skill}" | tr '/' '-')"
            # The host-side overlay capture (§10.0) mounts overlayfs, which needs root, so the
            # run goes under sudo with the key preserved. The key never reaches the sandbox.
            if sudo --preserve-env=ANTHROPIC_API_KEY "${bw}" run "${skill}" \
                 --config "${BELLWETHER_CONFIG}" --policy "${BELLWETHER_POLICY}" \
                 --max-tokens "${BELLWETHER_MAX_TOKENS}" --out "${out}"; then
              verdict_status=0
            else
              verdict_status=$?
            fi
            sudo chown -R "$(id -u):$(id -g)" "${out}" || true
            # The artifact tree is the single <out>/<eval_id>/ directory; find it at the top
            # level rather than descending into the root-owned overlay dirs under it.
            # The evaluation tree is the single <out>/<eval_id>/ directory. <out>/.cache is the
            # run cache (§19.2), a *sibling* the same command creates — so the old
            # `find | head -n1` picked whichever the kernel listed first, and on PR #78 it
            # picked .cache: the report read "(no report was rendered)" though one existed,
            # `pr-comment` failed silently behind its `|| true` so no verdict reached the PR,
            # the rm below cleared the run cache instead of the overlay scratch, and
            # upload-artifact then died on the mode-000 overlayfs workdir it had left behind.
            # A verdict that never posts and evidence that never uploads, with the step's own
            # output looking clean — this tool's signature failure mode, in this tool's CI.
            # Select deterministically (§24: sorted walks, never directory order) and refuse
            # rather than guess if there is not exactly one candidate.
            mapfile -t eval_dirs < <(find "${out}" -maxdepth 1 -mindepth 1 -type d \
              ! -name .cache | sort)
            if [ "${#eval_dirs[@]}" -ne 1 ]; then
              echo "::error::expected exactly one evaluation directory under ${out}," \
                   "found ${#eval_dirs[@]}: ${eval_dirs[*]:-(none)}"
              exit 3
            fi
            eval_dir="${eval_dirs[0]}"
            # Drop the per-run sandbox scratch under runs/ before it reaches upload-artifact. It
            # holds the kernel's overlayfs workdir — a `work/work` dir left mode 000, which even a
            # chown cannot make readable — so the artifact's include/exclude tree walk hits EACCES
            # on it even though the path already excludes runs/**. It carries no evidence the
            # artifact keeps (the ARF traces live at <eval_dir>/traces/, beside it), so remove it.
            sudo rm -rf "${eval_dir}/runs" 2>/dev/null || true
            # Surface the evidence inline: the rendered report (verdict, per-repetition outcome
            # grid, capability heatmap) goes into the job log, so *why* a run landed where it did
            # is visible here without opening the PR. The full ARF traces are uploaded below.
            echo "::group::Bellwether report — ${skill}"
            cat "${eval_dir}/report/pr_comment.md" 2>/dev/null || echo "(no report was rendered)"
            echo "::endgroup::"
            uv run bellwether pr-comment "${eval_dir}" || true
            # Exit 2 is a real not_ready verdict; 3 is infrastructure. Either keeps the check
            # red, but a not_ready is the skill's result, not a broken job.
            [ "${verdict_status}" -ne 0 ] && status="${verdict_status}"
            echo "::endgroup::"
          done < changed-skills.txt
          exit "${status}"

      - name: Upload the evidence
        # The point of the project made operational: a verdict is only as trustworthy as the
        # ground truth behind it, so that ground truth must not die with the runner. This uploads
        # the artifact tree — the per-run ARF traces, the rendered report, summary.json,
        # verdict.json — so anyone can retrieve exactly what the run observed. The traces are
        # redacted at capture (§3.3), so they are safe to publish by design. `always()` so a
        # not_ready or infrastructure-failed run keeps its evidence too — those are the runs you
        # most want to inspect. The bulky root-owned overlay working dirs under runs/ are excluded.
        if: >-
          always() &&
          steps.detect.outputs.skills != '' &&
          contains(github.event.pull_request.labels.*.name, 'bellwether-run')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bellwether-evidence
          # `.bellwether-out` is a dotfile tree; upload-artifact defaults include-hidden-files
          # to false, so without this the evidence uploads as an empty artifact — the ground
          # truth the whole step exists to preserve, silently dropped.
          include-hidden-files: true
          path: |
            .bellwether-out/**
            !.bellwether-out/**/runs/**
          # A run that produced no evidence tree is a regression (a failed capture, a moved
          # output dir), not a warning to scroll past — fail the step so it is seen.
          if-no-files-found: error
