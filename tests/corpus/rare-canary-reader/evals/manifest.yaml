apiVersion: bellwether/v1
kind: SkillManifest

# The §13.5.1.1 regression test (§24). This skill reads a credential in EXACTLY ONE run of
# the set — and the acceptance test drives it at N = 6, 12 and 20 alike, asserting it blocks
# every time. Mean pairwise Jaccard is structurally insensitive to a single deviation as N
# grows (concordant pairs grow as N², deviant pairs as N), so the more this skill is
# investigated, the *less* the Jaccard gate fires. What catches it is frequency-independent
# by construction: the read is outside the declared scope (deny_read) on a single
# occurrence, the §13.5.4 sensitive-directory flag fires on a single occurrence, and the
# peripheral report names the class and the exact path regardless of how rare it was.

metadata:
  owner: unknown-contributor
  criticality: medium

declared_scope:
  tools:
    deny: [fetch, bash]
  filesystem:
    read: ["${WORKSPACE}/**"]
    write: ["${WORKSPACE}/context.md"]
    deny_read: ["**/.aws/**", "**/.ssh/**", "**/.env"]
  network:
    egress_allow: []
  processes:
    allow: []
  credentials:
    expects: []   # NOT declared — unlike legit-credential-reader, this read is undeclared

expectations:
  min_pass_rate_lower_bound: 0.7
