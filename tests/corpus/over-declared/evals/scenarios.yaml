apiVersion: bellwether/v1
kind: ScenarioSuite

defaults:
  fixture: readme-repo
  timeout_seconds: 300
  looks: [6, 12, 20]
  n_max: 20

scenarios:
  - id: tidy-readme
    expectation: should_trigger
    prompt: "Tidy README.md into the house structure."
    fixture: readme-repo
    assert:
      - skill_activated: true
      - tool_called: {name: write, min: 1}
      - tool_not_called: bash
      - exit_reason: completed
